<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>build-deck demo</title>
<style>
html, body { font-family: sans-serif; }
.slide { background: #fff; color: #222; padding: 80px; font-size: 40px; }
.foot { position: absolute; left: 80px; bottom: 40px; font-size: 20px; }
</style>
</head>
<body>
<div id="stage">
<section class="slide title" data-nofoot><h1>A title slide</h1></section>
<section class="slide"><h2>Inline and display</h2>
<div class="box"><div>Energy \(E = \V{m} c^2\)</div></div>
\[ \int_0^1 x^2\,dx = \tfrac13 \]
</section>
<div class="slide"><h2>A figure</h2><div class="fig"><img src="asset:dot.svg" alt="a dot"></div></div>
</div>
</body>
</html>
