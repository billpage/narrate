<!DOCTYPE html>

<head>

<title>narrate demo</title>

.slide h1 { font-size: 64px; margin: 0 0 30px; }
.title { display: flex; flex-direction: column; justify-content: center; text-align: center; }
</style>
</head>

<div id="stage">
<section class="slide"><h1>Names</h1><p>Oziewicz wrote ℏ.</p></section>
<section class="slide"><h1>Homographs</h1><p>We read the papers; ψ₀ is the initial state.</p></section>
<section class="slide title"><h1>Γ and the end</h1></section>
</div>
<div id="notes"></div>
<script>
const NOTES = ["Oziewicz wrote ℏ for the reduced constant.", "We read the papers. ψ₀ is the initial state.", "Γ is the gamma function; the end."];
</script>
</body>
</html>
