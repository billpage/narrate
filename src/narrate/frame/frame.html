<!-- narrate frame: the notes panel, the bar and the navigation script. Added by
     `narrate build-deck` after the stage of a source that has no frame of its own. -->
<div id="notes" class="show" aria-live="polite"></div>
<div id="bar">
<button id="prev" aria-label="Previous slide">&larr;</button>
<span id="count"></span>
<button id="next" aria-label="Next slide">&rarr;</button>
<button id="nbtn" aria-pressed="true">Notes (N)</button>
</div>
<script>
const NOTES = [];
const slides = Array.from(document.querySelectorAll('.slide'));
const stage = document.getElementById('stage');
const notesEl = document.getElementById('notes');
const nbtn = document.getElementById('nbtn');
let i = 0;
// The notes are a panel on the right, shown at first; N hides and shows them.
// The slide is scaled to the space left of the panel. In a narrow window
// (portrait phone) the panel goes below the slide instead.
function fit() {
  const bar = 34, W = window.innerWidth, H = window.innerHeight - bar;
  const shown = notesEl.classList.contains('show');
  const below = W < 700;
  notesEl.classList.toggle('below', below);
  const nw = shown && !below ? Math.round(Math.min(640, Math.max(300, 0.32 * W))) : 0;
  notesEl.style.width = below ? '' : nw + 'px';
  const w = W - nw;
  const s = Math.min(w / 1920, H / 1080);
  const x = (w - 1920 * s) / 2;
  // Below: the slide at the top, the notes in the space under it.
  const y = shown && below ? 0 : (H - 1080 * s) / 2;
  notesEl.style.top = shown && below ? Math.round(1080 * s) + 'px' : '';
  stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
}
function show(k) {
  i = Math.max(0, Math.min(slides.length - 1, k));
  slides.forEach((el, j) => el.classList.toggle('current', j === i));
  document.getElementById('count').textContent = `${i + 1} / ${slides.length}`;
  notesEl.textContent = NOTES[i] || '(no notes)';
  notesEl.scrollTop = 0;
  try { if (location.hash !== '#' + (i + 1)) history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
}
function toggleNotes() {
  const on = notesEl.classList.toggle('show');
  nbtn.setAttribute('aria-pressed', String(on));
  fit();
}
document.getElementById('prev').onclick = () => show(i - 1);
document.getElementById('next').onclick = () => show(i + 1);
nbtn.onclick = toggleNotes;
stage.addEventListener('click', e => show(e.clientX < stage.getBoundingClientRect().left + stage.getBoundingClientRect().width / 3 ? i - 1 : i + 1));
document.addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); show(i + 1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); show(i - 1); }
  else if (e.key === 'Home') show(0);
  else if (e.key === 'End') show(slides.length - 1);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
});
window.addEventListener('resize', fit);
window.addEventListener('hashchange', () => show(parseInt(location.hash.slice(1), 10) - 1 || 0));
fit();
show((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
