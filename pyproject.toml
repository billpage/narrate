[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "narrate"
version = "1.0.0"
description = "Narrate slide pages and PowerPoint decks from their speaker notes"
readme = "README.md"
license = "MIT"
authors = [{ name = "Bill Page" }]
requires-python = ">=3.9"
dependencies = ["edge-tts", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
pptx = ["python-pptx", "lxml"]
piper = ["piper-tts"]

[project.scripts]
voiceover = "narrate.voiceover:main"
narrate = "narrate.cli:main"

[project.urls]
Source = "https://github.com/billpage/narrate"

[tool.setuptools.package-data]
narrate = ["terms/*.json", "frame/*", "tex_svg.mjs"]
